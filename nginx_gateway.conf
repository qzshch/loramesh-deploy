user  root;
worker_processes  1;

events {
    worker_connections  1024;
}


http {
    include       mime.types;
    include /etc/nginx/lan.geo;
    default_type  application/octet-stream;

    limit_req_zone $binary_remote_addr zone=apilimit:10m rate=5r/s;
    client_max_body_size 500M;
    sendfile        on;
    proxy_read_timeout 900;
    keepalive_timeout 900;
    ssl_protocols TLSv1.2 TLSv1.3;
    expires -1;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    add_header Pragma "no-cache";
    server_tokens off;

    server {
      listen 80;
        server_name  localhost;

        location /python/ {
            proxy_pass http://127.0.0.1:9001/;
        }
	location /node-red {
		proxy_pass https://127.0.0.1:1880;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
	}
        location /mesh/ {
            proxy_pass http://127.0.0.1:8088/;
            proxy_set_header Host $host;
        }
        location / {
            proxy_pass http://127.0.0.1:17080;
        }
        location ~/api/ {
            limit_req zone=apilimit burst=5 nodelay;
            proxy_pass http://127.0.0.1:8081;proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
      listen 443 ssl;
        server_name  localhost;

        ssl_certificate      /etc/https.crt;
        ssl_certificate_key  /etc/https.key;

        location /python/ {
            proxy_pass http://127.0.0.1:9001/;
        }
        location / {
            proxy_pass https://127.0.0.1:17443;
        }
        location ~/api/ {
            limit_req zone=apilimit burst=5 nodelay;
            proxy_pass https://127.0.0.1:8080;proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;proxy_set_header X-From-LAN $is_lan;
        }

        location /node-red {
            proxy_pass https://127.0.0.1:1880;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
